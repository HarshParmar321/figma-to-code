<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font: 12px/1.5 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff);
  }
  h1 { font-size: 14px; margin: 0 0 4px; }
  h2 { font-size: 12px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--figma-color-text-secondary, #666); }
  p.hint { margin: 0 0 12px; color: var(--figma-color-text-secondary, #666); }
  .frame { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--figma-color-border, #e5e5e5); border-radius: 6px; margin-bottom: 6px; }
  .frame .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .frame .size { color: var(--figma-color-text-secondary, #666); font-variant-numeric: tabular-nums; }
  select, input { font: inherit; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--figma-color-border, #ccc); background: var(--figma-color-bg, #fff); color: inherit; }
  input { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 8px 10px; border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    background: var(--figma-color-bg-brand, #0d99ff); color: var(--figma-color-text-onbrand, #fff); }
  button.secondary { background: transparent; color: inherit; border-color: var(--figma-color-border, #ccc); }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-top: 12px; min-height: 18px; color: var(--figma-color-text-secondary, #666); }
  #status.error { color: var(--figma-color-text-danger, #d22); }
  #report { margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 4px 0; border-bottom: 1px solid var(--figma-color-border, #eee); vertical-align: top; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .finding { padding: 6px 8px; border-radius: 4px; margin-bottom: 4px; background: var(--figma-color-bg-secondary, #f5f5f5); }
  .finding.error { border-left: 3px solid var(--figma-color-border-danger, #d22); }
  .finding.warning { border-left: 3px solid var(--figma-color-border-warning, #e6a700); }
  .finding.info { border-left: 3px solid var(--figma-color-border, #ccc); }
  .empty { color: var(--figma-color-text-secondary, #666); padding: 8px 0; }
</style>
</head>
<body>
  <h1>Figma to Code · Spike 1</h1>
  <p class="hint">Select a desktop frame and its mobile frame, check their roles, then export.</p>

  <h2>Selected frames</h2>
  <div id="frames"><div class="empty">Select one or more frames on the canvas.</div></div>
  <div id="ignored" class="hint"></div>

  <h2>Engine</h2>
  <input id="engine" value="http://localhost:8000" spellcheck="false" />

  <div class="row">
    <button id="export" disabled>Export</button>
  </div>
  <div class="row">
    <button id="upload" class="secondary" disabled>Upload to Engine</button>
    <button id="download" class="secondary" disabled>Download JSON</button>
  </div>

  <div id="status"></div>
  <div id="report"></div>
  <!-- SCRIPT -->
</body>
</html>
